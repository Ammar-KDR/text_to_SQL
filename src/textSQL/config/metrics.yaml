  # ==========================
  # CAMPAIGN METRICS
  # ==========================

  - name: campaign_conversion_rate

    domain: marketing

    synonyms:
      - campaign success rate
      - conversion percentage

    description: >
      Percentage of customers associated with a campaign who have
      an explicitly recorded campaign conversion.

    formula: >
      converted_customers / campaign_customers

    authoritative_source: campaign_conversions

    required_tables:
      - campaign_conversions
      - customer_campaigns
      - campaigns

    required_columns:
      - campaign_id
      - customer_id
      - order_id

    required_metrics: []

    business_rules:
      - Conversions must come from explicit campaign_conversions records
      - Do not infer campaign conversions from matching dates alone

    forbidden_sources: []


  - name: campaign_revenue

    domain: marketing

    synonyms:
      - campaign sales
      - marketing revenue

    description: >
      Net merchandise revenue attributed to marketing campaigns.

    formula: >
      SUM(fact_sales.revenue)

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - dim_campaign

    required_columns:
      - campaign_key
      - campaign_name
      - revenue

    required_metrics:
      - revenue

    business_rules:
      - Campaign attribution comes from the campaign key populated through explicit conversion attribution
      - Do not infer campaign attribution from matching dates

    forbidden_sources: []



  # ==========================
  # PAYMENT METRICS
  # ==========================


  - name: payment_success_rate

    domain: payment

    synonyms:
      - payment completion rate
      - successful payments

    description: >
      Percentage of payment attempts that successfully completed.

    formula: >
      successful_payment_attempts / total_payment_attempts

    authoritative_source: payments

    required_tables:
      - payments

    required_columns:
      - payment_status
      - attempted_at
      - completed_at

    required_metrics: []

    business_rules: []
      
    forbidden_sources: []



  # ==========================
  # REVIEW METRICS
  # ==========================


  - name: average_rating

    domain: product

    synonyms:
      - customer rating
      - product score
      - review score

    description: >
      Average customer rating assigned to products.

    formula: >
      AVG(reviews.rating)

    authoritative_source: reviews

    required_tables:
      - reviews

    required_columns:
      - rating
      - product_id

    required_metrics: []

    business_rules: []
      

    forbidden_sources: []