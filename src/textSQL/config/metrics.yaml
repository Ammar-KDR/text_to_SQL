metrics:


  # ==========================
  # SALES METRICS
  # ==========================


  - name: revenue

    domain: sales

    synonyms:
      - sales
      - income
      - earnings
      - turnover
      - net sales

    description: >
      Net merchandise revenue after item discounts and completed
      refund adjustments.

    formula: >
      SUM(fact_sales.revenue)

    authoritative_source: fact_sales

    required_tables:
      - fact_sales

    required_columns:
      - revenue
      - order_id
      - date_key

    required_metrics: []

    business_rules:
      - fact_sales.revenue is already adjusted for item discounts
      - completed refund amounts are already reflected in fact_sales.revenue
      - cancelled orders are excluded from fact_sales
      - Prefer fact_sales as the authoritative analytical revenue source

    forbidden_sources:
      - payments
      - orders

  - name: profit

    domain: sales

    synonyms:
      - net profit
      - sales profit
      - merchandise profit

    description: >
      Profit generated from merchandise sales after revenue and
      historical transaction cost adjustments.

    formula: >
      SUM(fact_sales.profit)

    authoritative_source: fact_sales

    required_tables:
      - fact_sales

    required_columns:
      - profit
      - revenue
      - cost
      - date_key

    required_metrics:
      - revenue

    business_rules:
      - profit equals revenue minus cost
      - historical sales cost originates from order_items.unit_cost
      - Prefer fact_sales as the authoritative analytical profit source

    forbidden_sources:
      - payments

  - name: gross_sales

    domain: sales

    synonyms:
      - gross revenue
      - total sales
      - sales volume

    description: >
      Total merchandise sales value before refund adjustments.

    formula: >
      SUM(order_items.line_total)

    authoritative_source: order_items

    required_tables:
      - order_items
      - orders

    required_columns:
      - line_total
      - order_id
      - order_status

    required_metrics: []

    business_rules:
      - Order status must be considered when determining eligible sales

    forbidden_sources:
      - payments



  - name: order_count

    domain: sales

    synonyms:
      - number of orders
      - purchases
      - transactions

    description: >
      Number of completed customer orders.

    formula: >
      COUNT(DISTINCT orders.order_id)

    authoritative_source: orders

    required_tables:
      - orders

    required_columns:
      - order_id
      - order_status

    required_metrics: []

    business_rules:
      - Exclude cancelled orders

    forbidden_sources: []



  - name: average_order_value

    domain: sales

    synonyms:
      - average purchase value
      - average transaction value
      - AOV

    description: >
      Average revenue generated per completed order.

    formula: >
      revenue / order_count

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - orders

    required_columns:
      - revenue
      - order_id
      - order_status

    required_metrics:
      - revenue
      - order_count

    business_rules:
      - Use completed orders only

    forbidden_sources: []



  # ==========================
  # CUSTOMER METRICS
  # ==========================

  # ==========================
  # CUSTOMER METRICS
  # ==========================


  - name: active_customers

    domain: customer

    synonyms:
      - purchasing customers
      - buying customers
      - active buyers

    description: >
      Customers represented in sales activity during a selected
      time period.

    formula: >
      COUNT(DISTINCT fact_sales.customer_key)

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - dim_date

    required_columns:
      - customer_key
      - date_key
      - full_date

    required_metrics: []

    business_rules:
      - A time period must be defined
      - Customer activity for this metric is based on sales records

    forbidden_sources:
      - customer_events


  - name: customer_lifetime_value

    domain: customer

    synonyms:
      - CLV
      - customer value
      - lifetime revenue

    description: >
      Total revenue generated by a customer during their relationship
      with the business.

    formula: >
      SUM(fact_sales.revenue) GROUP BY fact_sales.customer_key

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - dim_customer

    required_columns:
      - customer_key
      - customer_id
      - revenue

    required_metrics:
      - revenue

    business_rules:
      - Refunds are already reflected in the authoritative revenue metric
      - Customer aggregation is required

    forbidden_sources:
      - payments


  - name: customer_retention_rate

    domain: customer

    synonyms:
      - retention
      - customer loyalty
      - repeat customers

    description: >
      Percentage of customers from a baseline purchasing period
      who also purchase during a later retention period.

    formula: >
      retained_customers / baseline_customers

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - dim_date

    required_columns:
      - customer_key
      - date_key
      - full_date

    required_metrics: []

    business_rules:
      - A baseline period must be defined
      - A retention period must be defined
      - A retained customer must have sales activity in both periods

    forbidden_sources:
      - customer_events

  # ==========================
  # PRODUCT METRICS
  # ==========================


  - name: product_revenue

    domain: product

    synonyms:
      - revenue by product
      - product sales
      - product performance

    description: >
      Revenue contribution generated by individual products.

    formula: >
      SUM(fact_sales.revenue) GROUP BY fact_sales.product_key

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - dim_product

    required_columns:
      - product_key
      - product_name
      - revenue

    required_metrics:
      - revenue

    business_rules:
      - Product attribution must come from sales records

    forbidden_sources: []



  - name: top_products

    domain: product

    synonyms:
      - best selling products
      - highest revenue products
      - product ranking

    description: >
      Products ranked according to generated revenue.

    formula: >
      ORDER BY product_revenue DESC

    authoritative_source: fact_sales

    required_tables:
      - fact_sales
      - dim_product

    required_columns:
      - product_key
      - revenue
      - product_name

    required_metrics:
      - product_revenue

    business_rules:
      - Ranking metric must be specified

    forbidden_sources: []



  # ==========================
  # INVENTORY METRICS
  # ==========================

  - name: available_inventory

    domain: inventory

    synonyms:
      - available stock
      - sellable inventory
      - stock availability

    description: >
      Current inventory available for sale after subtracting
      reserved stock.

    formula: >
      inventory.quantity_on_hand - inventory.quantity_reserved

    authoritative_source: inventory

    required_tables:
      - inventory

    required_columns:
      - warehouse_id
      - variant_id
      - quantity_on_hand
      - quantity_reserved

    required_metrics: []

    business_rules:
      - Reserved inventory cannot be sold
      - inventory represents current inventory state

    forbidden_sources:
      - inventory_transactions


